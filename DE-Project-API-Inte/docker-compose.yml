version: "3.9"

services:
  mysql_source:
    image: mysql:8.0
    container_name: mysql_source
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce_network

  postgres_dw:
    image: postgres:15
    container_name: postgres_dw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce_network

  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    env_file:
      - .env
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./pyspark_apps:/opt/bitnami/spark/apps
      - ./data_lake:/opt/data_lake
      - ./jars:/opt/spark/jars
    networks:
      - ecommerce_network

  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark-worker
    depends_on:
      - spark-master
    env_file:
      - .env
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./pyspark_apps:/opt/bitnami/spark/apps
      - ./data_lake:/opt/data_lake
      - ./jars:/opt/spark/jars
    networks:
      - ecommerce_network

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: airflow-init-custom:2.8.0
    container_name: airflow-init
    depends_on:
      - postgres_dw
    env_file:
      - .env
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - _AIRFLOW_WWW_USER_USERNAME=${_AIRFLOW_WWW_USER_USERNAME}
      - _AIRFLOW_WWW_USER_PASSWORD=${_AIRFLOW_WWW_USER_PASSWORD}
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX=True
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_plugins:/opt/airflow/plugins
      - ./pyspark_apps:/opt/bitnami/spark/apps
      - ./data_lake:/opt/data_lake
      - ./jars:/opt/spark/jars
      - ./data_generation:/opt/airflow/data_generation

    command: >
      bash -c "
        airflow db init &&
        airflow users create --username ${_AIRFLOW_WWW_USER_USERNAME} --password ${_AIRFLOW_WWW_USER_PASSWORD} --firstname Air --lastname Flow --role Admin --email admin@example.com
      "
    networks:
      - ecommerce_network

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: airflow-webserver-custom:2.8.0
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      - airflow-init
      - spark-master
      - spark-worker
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX=True
    ports:
      - "8081:8080"
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_plugins:/opt/airflow/plugins
      - ./pyspark_apps:/opt/bitnami/spark/apps
      - ./data_lake:/opt/data_lake
      - ./jars:/opt/spark/jars
      - ./data_generation:/opt/airflow/data_generation
    command: webserver
    networks:
      - ecommerce_network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: airflow-scheduler-custom:2.8.0
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-init
      - spark-master
      - spark-worker
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW__WEBSERVER__SECRET_KEY}
      - AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX=True
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_plugins:/opt/airflow/plugins
      - ./pyspark_apps:/opt/bitnami/spark/apps
      - ./data_lake:/opt/data_lake
      - ./jars:/opt/spark/jars
      - ./data_generation:/opt/airflow/data_generation
    command: scheduler
    networks:
      - ecommerce_network

  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - ecommerce_network

  kafka:
    image: bitnami/kafka:3.6
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
    depends_on:
      - zookeeper
    networks:
      - ecommerce_network

  posthog-event-producer:
    build:
      context: .
      dockerfile: Dockerfile.posthog
    container_name: posthog-event-producer
    depends_on:
      kafka:
        condition: service_started
      mysql_source:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
    volumes:
      - ./posthog_event_producer.py:/app/posthog_event_producer.py
    command: ["sleep", "infinity"]
    networks:
      - ecommerce_network

  posthog-event-consumer:
    build:
      context: .
      dockerfile: Dockerfile.posthog
    container_name: posthog-event-consumer
    depends_on:
      - kafka
    env_file:
      - .env
    environment:
      - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      - POSTHOG_HOST=${POSTHOG_HOST}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
    volumes:
      - ./posthog_event_consumer.py:/app/posthog_event_consumer.py
    command: >
      python /app/posthog_event_consumer.py
    networks:
      - ecommerce_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      - kafka
    networks:
      - ecommerce_network

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: superset
    depends_on:
      - postgres_dw
    env_file:
      - .env
    ports:
      - "8088:8088"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: admin@superset.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    volumes:
      - superset_data:/app/superset_home
    command: >
      /bin/bash -c "
        superset db upgrade &&
        superset fab create-admin --username ${ADMIN_USERNAME} --firstname Admin --lastname User --email admin@superset.com --password ${ADMIN_PASSWORD} || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088
      "
    networks:
      - ecommerce_network

volumes:
  mysql_data:
  postgres_data:
  superset_data:

networks:
  ecommerce_network:
    driver: bridge
